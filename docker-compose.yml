version: '3.8'

services:
  # --- THE MESSAGING LAYER (KAFKA) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: lakehouse_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: lakehouse_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- THE STORAGE LAYER (OBJECT STORAGE / S3 MOCK) ---
  minio:
    image: minio/minio:latest  # ◄── CHANGED THIS: Pointing to the latest stable production build
    container_name: lakehouse_minio
    ports:
      - "9000:9000"  # S3 API Endpoint
      - "9001:9001"  # Web Console UI
    environment:
      MINIO_ROOT_USER: admin_key
      MINIO_ROOT_PASSWORD: secret_session_password
    volumes:
      - minio_storage:/data
    command: server /data --console-address ":9001"

volumes:
  minio_storage: